{% extends "admin/base_site.html" %}
{% block content %}
  <h1>Confirmar eliminacion</h1>
  <p>Seguro que deseas eliminar la plantilla <code>{{ template_id }}</code>?</p>
  <form method="post">
    {% csrf_token %}
    <input type="submit" value="Si, eliminar" class="deletelink"/>
    <a class="button" href="{% url 'admin:templates_admin_list' %}">Cancelar</a>
  </form>
{% endblock %}
